<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>正文抓取下载</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="brand">LESP·辑微</span>
    <span class="sub">正文抓取下载</span>
  </header>

  <section class="row">
    <label for="fmt">导出格式</label>
    <select id="fmt">
      <option value="pdf" selected>PDF（推荐，保留原页面排版）</option>
      <option value="html">HTML（带阅读样式）</option>
      <option value="md">Markdown</option>
      <option value="txt">纯文本 TXT</option>
    </select>
  </section>

  <section class="row">
    <label for="name">文件名</label>
    <input id="name" type="text" placeholder="留空则自动用文章标题">
  </section>

  <section class="opts">
    <label><input type="checkbox" id="wait"> 等待动态内容加载（最多 3 秒）</label>
    <label><input type="checkbox" id="images" checked> 导出 HTML/Markdown 时保留图片</label>
    <label><input type="checkbox" id="saveAs" checked> 下载时弹出“另存为”对话框</label>
  </section>

  <section class="row">
    <label>本次还要做什么</label>
    <label class="inline"><input type="checkbox" id="fulltext"> 尝试下载全文（PDF/CAJ，需已登录且有权限）</label>
    <label class="inline"><input type="checkbox" id="sync" checked> 同步到「辑微」App 的研究论文</label>
  </section>

  <button id="go" class="primary">抓取并下载</button>

  <div id="status" class="status" hidden></div>
  <div id="meta" class="meta" hidden></div>

  <details id="syncConf">
    <summary>连接「辑微」App 的设置</summary>
    <div class="conf">
      <label>App 端口<input id="port" type="text" placeholder="8787"></label>
      <label>同步口令<input id="token" type="text" placeholder="在 App 设置页复制"></label>
      <button id="ping" class="link">测试连接</button>
      <button id="diag" class="link">诊断下载链接（复制报告）</button>
      <button id="probe" class="link">试下载一次（判断是否真有权限）</button>
      <div id="pingMsg" class="hint"></div>
    </div>
  </details>

  <footer>
    PDF 需要临时开启浏览器的调试通道，期间会出现“正在调试此浏览器”横幅，导出完成后立即关闭。<br>
    全部处理都在本机完成，不联网、不上传。<br>
    <span id="ver"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
